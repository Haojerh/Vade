name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate stable version tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion" -or $packageVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must match the stable package.json version' }
      - run: npm ci --include=optional
      - run: npm run build:desktop
        env:
          NODE_OPTIONS: --max-old-space-size=3072 --max-semi-space-size=4
          GOMAXPROCS: '1'
      - name: Build Windows installer and updater manifest
        run: node scripts/package-desktop.mjs --release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Publish complete desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $output = Get-ChildItem -LiteralPath release -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$output) { throw 'Installer output directory is missing' }
          $installer = @(Get-ChildItem -LiteralPath $output.FullName -File -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          if ($installer[0].Name -ne "Vade-Setup-$packageVersion.exe") { throw 'Unexpected installer asset name' }
          $assets = @($installer[0].FullName, "$($installer[0].FullName).blockmap", (Join-Path $output.FullName 'latest.yml'))
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" } }
          if (!((Get-Content -LiteralPath $assets[2]) -contains "path: $($installer[0].Name)")) { throw 'Updater manifest does not match installer asset name' }
          $notes = "docs/releases/v$packageVersion.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release notes are missing' }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Vade v$packageVersion" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all release assets; release remains a draft' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the complete release' }
