<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orca Live Workflow Dashboard</title>
    <meta name="description" content="Read-only live monitoring dashboard for Orca worktrees, orchestrators, agents, and GitHub activity" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('orca-theme');
          var theme = saved;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
